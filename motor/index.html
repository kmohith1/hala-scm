"use strict";
/* ============================================================
   Hala Motor Tracker — warehouse workspace.
   One self-contained page. It signs the user in with their Hala
   Microsoft account and reads/writes the Fleet Ops SharePoint lists
   directly as that user; nothing is stored anywhere else.
   Every rule that changes a record follows the Power Apps screens
   (inspection, claim, DC, ship, register, movement), so both write
   the same columns and can be used side by side.
   ============================================================ */
const CFG = {
  /* Neither value is a secret: a browser app publishes its client ID to every
     visitor by design, and sign-in still needs a Hala account. */

  tenantId: "cc8957c3-8255-47ab-b223-0fa2bb99e2a3",
  authority: "https://login.microsoftonline.com",
  spHost: "https://halamobility.sharepoint.com",
  site: "/sites/fleetops",
  dcFolder: "/sites/fleetops/Shared Documents/Inspection Reports",
  powerApp: "https://apps.powerapps.com/play/e/Default-cc8957c3-8255-47ab-b223-0fa2bb99e2a3/a/7942897f-4f0a-474b-89e4-8af8924059aa",

const HOME = "Jeedimetla - Main Warehouse";
const PLANT = "OEM - Plant";
/* Items.Availability values, exactly as the lists store them. */

  bench: "AWAITING BENCH TEST", oemInsp: "AWAITING OEM INSPECTION",

  dcReady: "Ready to ship - DC generated", away: "Away from Jeedimetla", scrap: "Scrap",

/* Claims.ClaimStatus values used by the warranty journey. */
const CS = {raised: "Claim raised - awaiting DC", dc: "DC generated - ready to ship", sent: "Sent to OEM"};
const SHIP_REASON = "Shipped to plant (warranty approved)";
const STAGES = {inspection: "Inspection / bench test", available: "Available to use", claimReady: "Ready for warranty claim",
  claimRaised: "Claim raised · DC pending", dcReady: "DC ready · Awaiting shipping", shipped: "At OEM / plant",
  scrap: "Scrap", away: "At another location", other: "Other status"};

/* Movement rules (Log inward / outward). */
const FAULTY_STATES = [AV.oemInsp, AV.claimReady, "Claim approved - ship to plant", "Claim rejected - scrap or refurb"];
const WARRANTY_REASONS = ["Sent to OEM - warranty claim", SHIP_REASON];
const WARRANTY_STATES = [AV.claimReady, AV.claimRaised, AV.dcReady];
const WARRANTY_MSG = "Use Raise warranty claim, Generate DC, then Mark shipped to plant for warranty dispatch.";
const EX_OEM_REASONS = ["Received from OEM - replacement", "Received from OEM - repaired"];

const $ = s => document.querySelector(s);

/* ============================================================
   AUTH — authorization code + PKCE against Microsoft Entra,
   written directly so the page needs no external library.
   ============================================================ */
const LS_AUTH = "hala_motor_auth", SS_PKCE = "hala_motor_pkce", SS_STATE = "hala_motor_state", SS_SILENT = "hala_motor_silent";
let AUTH = {token: "", refresh: "", exp: 0, name: "", upn: "", known: false};
function loadAuth(){ const a = lsJson(LS_AUTH, null); if(a) AUTH = Object.assign(AUTH, a); }
const saveAuth = () => lsSet(LS_AUTH, JSON.stringify(AUTH));
/* Expiry keeps who you are, so the next sign-in is one tap; Sign out forgets it. */
function clearAuth(forget){
  AUTH = {token: "", refresh: "", exp: 0, name: forget ? "" : AUTH.name, upn: forget ? "" : AUTH.upn, known: forget ? false : AUTH.known};
  if(forget) lsDel(LS_AUTH); else saveAuth();
}
const tokenFresh = () => !!(AUTH.token && AUTH.exp > Date.now() + 60000);
function b64url(bytes){
  return btoa(String.fromCharCode.apply(null, new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function randStr(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a).slice(0, n); }
const redirectUri = () => location.origin + location.pathname;

async function signIn(silent){
  const verifier = randStr(64);
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  const state = randStr(16);
  sessionStorage.setItem(SS_PKCE, verifier);
  sessionStorage.setItem(SS_STATE, state);
  const q = new URLSearchParams({
    client_id: CFG.clientId, response_type: "code", redirect_uri: redirectUri(), response_mode: "query",
    scope: CFG.scopes, code_challenge: b64url(digest), code_challenge_method: "S256", state,
  });
  if(silent) q.set("prompt", "none");
  if(AUTH.upn) q.set("login_hint", AUTH.upn);
  location.href = CFG.authority + "/" + CFG.tenantId + "/oauth2/v2.0/authorize?" + q;
}
/* Returns "" when there was nothing to handle or sign-in succeeded,
   "silent" when a background attempt simply did not work, or an error text. */
async function handleRedirect(){
  const p = new URLSearchParams(location.search);
  const err = p.get("error"), code = p.get("code");
  if(!err && !code) return "";
  const desc = p.get("error_description") || err || "";
  const stateOk = p.get("state") === sessionStorage.getItem(SS_STATE);
  const verifier = sessionStorage.getItem(SS_PKCE) || "";
  history.replaceState({}, "", redirectUri());          // never leave the code in the address bar
  sessionStorage.removeItem(SS_PKCE); sessionStorage.removeItem(SS_STATE);
  if(err){
    if(/login_required|interaction_required|consent_required|AADSTS50058/i.test(err + " " + desc)) return "silent";
    return friendlyAuthError(err, desc);
  }
  if(!stateOk) return "Sign-in could not be verified. Please try again.";
  try{
    await tokenRequest({grant_type: "authorization_code", code, redirect_uri: redirectUri(), code_verifier: verifier});
    AUTH.known = true; saveAuth();
    sessionStorage.removeItem(SS_SILENT);
    return "";
  }catch(e){ return friendlyAuthError("token_error", e.message); }
}
function friendlyAuthError(code, desc){
  if(/AADSTS65001|AADSTS90094|admin|consent|access_denied/i.test(code + " " + desc))
    return "Microsoft did not grant access. If the screen said “Need admin approval”, a Hala administrator has to approve this app once before anyone can use it.";
  return "Sign-in did not complete: " + String(desc || code).split("\r\n")[0].slice(0, 220);
}
async function tokenRequest(extra){
  const body = new URLSearchParams(Object.assign({client_id: CFG.clientId, scope: CFG.scopes}, extra));
  const r = await fetch(CFG.authority + "/" + CFG.tenantId + "/oauth2/v2.0/token", {
    method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"}, body,
  });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error_description || j.error || ("HTTP " + r.status));
  AUTH.token = j.access_token;
  if(j.refresh_token) AUTH.refresh = j.refresh_token;
  AUTH.exp = Date.now() + Number(j.expires_in || 3600) * 1000;
  if(j.id_token){
    try{
      const part = j.id_token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      const c = JSON.parse(decodeURIComponent(escape(atob(part))));
      AUTH.name = c.name || AUTH.name; AUTH.upn = c.preferred_username || AUTH.upn;
    }catch(e){}
  }
  saveAuth();
}
class SignedOut extends Error{}
let refreshing = null;
async function ensureToken(){
  if(tokenFresh()) return AUTH.token;
  if(!AUTH.refresh) throw new SignedOut("signed out");
  /* Several lists load at once; they must share one refresh, not race four. */
  if(!refreshing) refreshing = (async () => {
    try{
      await tokenRequest({grant_type: "refresh_token", refresh_token: AUTH.refresh});
    }catch(e){
      /* A browser app's refresh token lives 24 hours and cannot be extended. */
      if(/AADSTS7000|AADSTS50173|AADSTS50076|invalid_grant|expired|revoked|interaction_required/i.test(e.message)){
        clearAuth(false); throw new SignedOut("signed out");
      }
      throw e;
    }finally{ refreshing = null; }
  })();
  await refreshing;
  return AUTH.token;
}

/* ============================================================
   SHAREPOINT — plain REST with the user's own token, so every row
   is written as the signed-in person and SharePoint permissions apply.
   ============================================================ */
async function sp(pathOrUrl, opts){
  opts = opts || {};
  const token = await ensureToken();
  const headers = {"Accept": "application/json;odata=nometadata", "Authorization": "Bearer " + token};
  let body;
  if(opts.bytes){ headers["Content-Type"] = "application/pdf"; body = opts.bytes; }
  else if(opts.body){ headers["Content-Type"] = "application/json;odata=nometadata"; body = JSON.stringify(opts.body); }
  if(opts.merge){ headers["X-HTTP-Method"] = "MERGE"; headers["IF-MATCH"] = "*"; }
  const url = /^https:/.test(pathOrUrl) ? pathOrUrl : CFG.web + pathOrUrl;
  if(url.indexOf(CFG.spHost + "/") !== 0) throw new Error("Unexpected address");
  const r = await fetch(url, {method: opts.method || (body ? "POST" : "GET"), headers, body});
  if(r.status === 401 && !opts.retried){ AUTH.exp = 0; return sp(pathOrUrl, Object.assign({}, opts, {retried: true})); }
  if(!r.ok){
    let msg = "HTTP " + r.status;
    try{ const j = await r.json(); msg = (j["odata.error"] && j["odata.error"].message.value) || (j.error && j.error.message) || msg; }catch(e){}
    const e = new Error(msg); e.status = r.status; throw e;
  }
  if(opts.blob) return r.blob();
  if(r.status === 204) return null;
  return r.json().catch(() => null);
}
async function listAll(path){
  let out = [], next = path;
  while(next){
    const j = await sp(next);
    out = out.concat(j.value || []);
    next = j["odata.nextLink"] || j["@odata.nextLink"] || "";
  }
  return out;
}
/* A create is never retried blindly: if the answer is lost the row may exist. */
const spCreate = (list, row) => sp(L(list) + "/items", {body: row});
/* An update is safe to repeat, so brief outages are ridden out. */
async function spMerge(list, id, patch){
  for(let attempt = 0; ; attempt++){
    try{ return await sp(L(list) + "/items(" + Number(id) + ")", {body: patch, merge: true}); }
    catch(e){
      const transient = !(e instanceof SignedOut) && (!e.status || e.status === 429 || e.status >= 500);
      if(!transient || attempt >= 2) throw e;
      await sleep(700 * (attempt + 1));
    }
  }
}
const spQuery = (list, query) => sp(L(list) + "/items?" + query).then(j => (j && j.value) || []);

/* E-Sprinto motors: approved repair cycles since the last recorded replacement. */
function sprintoCycles(title){
  const cs = D.claims.filter(c => c.ItemID === title && /sprinto/i.test(c.OEMSupplier || ""));
  let cutoff = 0;
  for(const c of cs) if(/replace/i.test(c.Resolution || "") && c.ReplacementSerial) cutoff = Math.max(cutoff, c.Id);
  return cs.filter(c => c.Id > cutoff && c.ClaimStatus === "Approved" && /repair/i.test(c.Resolution || "")).length;
}
const daysBetween = (a, b) => Math.floor((new Date(b) - new Date(a)) / 86400000);
function latestRepair(repairs, title){
  const now = Date.now();
  return repairs.filter(r => r.MotorID === title && r.ReturnDate && new Date(r.ReturnDate) <= now)
    .sort((a, b) => new Date(b.ReturnDate) - new Date(a.ReturnDate))[0] || null;
}
/* A claim waits for a DC when it is the unit's current claim, has no challan yet, and the unit is still here. */
function isDcPending(c){
  const u = unitOf(c);
  return !!u && c.ClaimStatus === CS.raised && !c.DC_x0020_Number && D.latestClaim.get(c.ItemID) === c
    && u.AtJeedimetla && u.Availability === AV.claimRaised;
}
/* A unit may be shipped only with a generated challan on its current claim. */
function isShippable(c){
  const u = unitOf(c);
  return !!u && u.AtJeedimetla && u.Availability === AV.dcReady && D.latestClaim.get(c.ItemID) === c
    && [CS.dc, CS.sent].includes(c.ClaimStatus) && !!c.DC_x0020_Number && !!dcUrlOf(c) && !!c.DC_x0020_Generated_x0020_Date;
}
function dcList(){
  const m = new Map();
  for(const c of D.claims){
    const n = c.DC_x0020_Number; if(!n) continue;
    if(!m.has(n)) m.set(n, {number: n, claims: [], url: "", date: c.DC_x0020_Generated_x0020_Date, oem: c.OEMSupplier});
    const d = m.get(n); d.claims.push(c); if(!d.url) d.url = dcUrlOf(c);
  }
  const list = [...m.values()];
  for(const d of list){
    d.ready = d.claims.filter(isShippable);
    d.sent = d.claims.filter(c => c.ClaimStatus === CS.sent && !isShippable(c)).length;
    d.status = d.ready.length ? (d.sent ? "Partly shipped" : "Ready to ship") : (d.sent === d.claims.length ? "Shipped" : "Needs review");
  }
  return list.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
}

/* ============================================================
   DELIVERY CHALLAN PDF — dependency-free A4. Text is reduced to
   plain ASCII and escaped before entering the PDF content stream.
   ============================================================ */
const ascii = s => String(s ?? "").normalize("NFKD").replace(/[^\x20-\x7e]/g, "?");
const pdfLit = s => ascii(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
function wrapText(s, width){
  const words = ascii(s).split(/\s+/).flatMap(w => w.length > width ? w.match(new RegExp(".{1," + width + "}", "g")) : [w]), lines = [];
  let line = "";
  for(const word of words){ if(line.length + word.length + 1 > width && line){ lines.push(line); line = ""; } line += (line ? " " : "") + word; }
  if(line) lines.push(line);
  return lines.length ? lines : [""];
}
function challanPdf(dc){
  const batches = [[]]; let height = 0;
  dc.units.forEach((u, index) => {
    const row = {u, index, idLines: wrapText(u.unitId, 37), serialLines: wrapText(u.serial, 32)};
    row.height = Math.max(row.idLines.length, row.serialLines.length) * 11 + 5;
    if(height + row.height > 320){ batches.push([]); height = 0; }
    batches[batches.length - 1].push(row); height += row.height;
  });
  const pages = batches.length, objects = [""], pageRefs = [];
  const add = s => (objects.push(s), objects.length - 1);
  const catalog = add(""), tree = add(""), font = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"),
        bold = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>");
  for(let p = 0; p < pages; p++){
    let stream = "";
    const text = (x, y, size, s, b) => { stream += "BT /" + (b ? "F2" : "F1") + " " + size + " Tf 1 0 0 1 " + x + " " + y + " Tm (" + pdfLit(s) + ") Tj ET\n"; };
    const line = y => { stream += "0.85 0.89 0.85 RG 42 " + y + " m 553 " + y + " l S\n"; };
    stream += "0.08 0.25 0.19 rg\n";
    text(42, 790, 24, "HALA", true); text(42, 766, 10, "Hala Mobility Pvt Ltd - Motor & controller operations");
    text(359, 789, 14, "DELIVERY CHALLAN", true); text(359, 766, 10, dc.number); line(746);
    text(42, 702, 10, "From: " + dc.from, true); text(359, 702, 10, "Date: " + dc.day);
    text(42, 680, 10, "To: " + dc.oem, true);
    wrapText(dc.destination, 88).slice(0, 5).forEach((s, i) => text(42, 661 - i * 13, 10, s));
    text(42, 573, 9, "Vehicle / transport: " + (dc.vehicle || "To be entered at dispatch"));
    text(42, 554, 9, "Purpose: Warranty inspection / repair / replacement. No sale.");
    line(535); text(46, 517, 9, "#", true); text(76, 517, 9, "UNIT ID", true); text(280, 517, 9, "TYPE", true); text(375, 517, 9, "SERIAL NUMBER", true); line(505);
    let rowY = 487;
    for(const row of batches[p]){
      text(46, rowY, 8, row.index + 1);
      row.idLines.forEach((s, i) => text(76, rowY - i * 11, 8, s));
      text(280, rowY, 8, row.u.type);
      row.serialLines.forEach((s, i) => text(375, rowY - i * 11, 8, s));
      rowY -= row.height;
    }
    line(146); text(42, 125, 10, "Total units: " + dc.units.length, true); text(359, 125, 9, "Prepared by: " + ascii(dc.createdBy).slice(0, 32));
    text(42, 84, 9, "Dispatch signature: __________________"); text(330, 84, 9, "Receiver signature: __________________");
    text(42, 43, 8, "Hala Motor Tracker | Internal delivery record"); text(472, 43, 8, "Page " + (p + 1) + " of " + pages);
    const content = add("<< /Length " + stream.length + " >>\nstream\n" + stream + "endstream");
    pageRefs.push(add("<< /Type /Page /Parent " + tree + " 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 " + font + " 0 R /F2 " + bold + " 0 R >> >> /Contents " + content + " 0 R >>"));
  }
  objects[catalog] = "<< /Type /Catalog /Pages " + tree + " 0 R >>";
  objects[tree] = "<< /Type /Pages /Count " + pages + " /Kids [" + pageRefs.map(n => n + " 0 R").join(" ") + "] >>";
  let out = "%PDF-1.4\n"; const offsets = [0];
  for(let i = 1; i < objects.length; i++){ offsets[i] = out.length; out += i + " 0 obj\n" + objects[i] + "\nendobj\n"; }
  const start = out.length;
  out += "xref\n0 " + objects.length + "\n0000000000 65535 f \n";
  for(let i = 1; i < objects.length; i++) out += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
  out += "trailer\n<< /Size " + objects.length + " /Root " + catalog + " 0 R >>\nstartxref\n" + start + "\n%%EOF\n";
  return new TextEncoder().encode(out);
}

}

function overview(){
  const motors = D.units.filter(u => u.ItemType === "Motor").length;
  const metrics = [
    ["Total units", D.units.length, motors + " motors · " + (D.units.length - motors) + " controllers", "inventory"],
    ["Available to use", count("available"), "Bench tested or ex-OEM, at Jeedimetla", "check"],
    ["Awaiting inspection", count("inspection"), "Units in the warehouse queue", "inspections"],
    ["Warranty pipeline", count("claimReady") + count("claimRaised") + count("dcReady"), "Approved failures awaiting next action", "claims"]];
  const flow = [["inspection", "Inspection", "inspections"], ["claimReady", "Raise warranty claim", "claims"], ["claimRaised", "Generate DC challan", "dc"],
    ["dcReady", "Ready to ship", "dc"], ["shipped", "At OEM / plant", "shipped"]];
  const order = {dcReady: 0, claimRaised: 1, claimReady: 2, inspection: 3};
  const attention = D.units.filter(u => u.stage in order).sort((a, b) => order[a.stage] - order[b.stage] || new Date(a.LastMovementDate || 0) - new Date(b.LastMovementDate || 0)).slice(0, 7);
  return title("Warehouse overview", "Every unit. Every movement.", "Your motor and controller operations, in one place.", regButton()) +
    '<section class="cards" aria-label="Stock totals">' + metrics.map(([label, n, sub, i], index) => '<div class="metric ' + (index === 0 ? "featured" : "") + '"><div class="metric-head">' + label + icon(i) +
      '</div><div class="number">' + n + '</div><small>' + sub + '</small></div>').join("") + '</section>' +
    '<section class="panel"><div class="panel-head"><div><h2>The warranty journey</h2><p class="subtext">Working units become available. Rejected failures become scrap.</p></div>' +
    '<button data-stage="scrap">Scrap <strong>' + count("scrap") + '</strong></button></div><div class="workflow">' +
    flow.map(([s, label, n], i) => '<button class="flow-card" ' + (n === "shipped" ? 'data-stage="shipped"' : 'data-nav="' + n + '"') + '><span class="flow-index">0' + (i + 1) + '</span><strong>' + count(s) + '</strong><span>' + label + '</span></button>').join("") +
    '</div></section><section class="panel"><div class="panel-head"><div><h2>Units needing attention</h2><p class="subtext">The next actions in your warehouse queue</p></div>' +
    '<button data-nav="inventory">View all units ' + icon("arrow") + '</button></div>' + unitTable(attention) +
    '<div class="table-footer"><span>Jeedimetla · Main warehouse</span><span>' + fmt(new Date()) + '</span></div></section>';
}
function filtered(){
  const q = search.trim().toLowerCase();
  return D.units.filter(u => {
    if(view === "inspections"){ if(!u.AtJeedimetla) return false; if(F.insp.scope === "queue" && u.stage !== "inspection") return false; }
    if(oem !== "All OEMs" && (u.OEMMake || "No OEM") !== oem) return false;
    if(type !== "All types" && u.ItemType !== type) return false;
    if(view === "inventory" && stage !== "All stages" && u.stage !== stage) return false;
    return !q || [u.Title, u.SerialNo, u.OEMMake, u.ItemType, u.CurrentLocation].join(" ").toLowerCase().includes(q);
  }).sort(byTitle);
}

function claims(){
  const list = claimOems(); if(!list.includes(claimOem)) claimOem = list.find(o => eligibleClaims(o).length) || list[0] || "";
  const eligible = eligibleClaims(claimOem);
  const raised = D.claims.filter(c => [CS.raised, CS.dc, CS.sent].includes(c.ClaimStatus) && norm(c.OEMSupplier) === norm(claimOem)).sort((a, b) => b.Id - a.Id).slice(0, 50);
  return title("OEM warranty", "Raise warranty claims", "Choose an OEM. All eligible units are included automatically.") +
    chips(claimOem, "claim-oem", f => eligibleClaims(f).length, list) +
    '<div class="instruction">' + icon("claims") + '<div><strong>' + eligible.length + ' ' + esc(claimOem) + ' units ready.</strong> This batch includes every Not working + Approved unit at the warehouse. No individual selection or fault category is needed.</div></div>' +

    '<div class="bulkbar"><span>All ' + eligible.length + ' eligible units will be included</span><button class="primary" data-action="claim"' + (eligible.length ? "" : " disabled") + '>Raise ' + eligible.length + ' claims ' + icon("arrow") + '</button></div></section>' +
    '<section class="panel"><div class="panel-head"><h2>Claims already raised</h2><button data-nav="dc">Generate delivery challan ' + icon("arrow") + '</button></div>' + claimTable(raised) + '</section>';
}
const dcPending = o => D.claims.filter(c => isDcPending(c) && norm(c.OEMSupplier) === norm(o)).sort((a, b) => a.Id - b.Id);
function dcOems(){ return [...new Set([...claimOems(), ...D.claims.filter(isDcPending).map(c => c.OEMSupplier)])]; }

    (docs.length ? docs.map(d => '<tr><td class="unit-id">' + esc(d.number) + '</td><td>' + esc(d.oem) + '<span class="unit-sub">' + fmt(d.date) + '</span></td><td>' + d.claims.length +

      (d.ready.length ? '<button class="primary" data-ship="' + esc(d.number) + '">Mark shipped →</button>' : '') + '</div></td></tr>').join("")

const actorOf = r => (r.Author && r.Author.Title) || "";
const inspEvent = r => ({unit: r.ItemID, action: "Inspection", details: [r.TestResult, r.OEMDecision && ("Warranty " + r.OEMDecision), r.FaultObserved, r.NextAction && ("Next: " + r.NextAction)].filter(Boolean).join(" · "),
  actor: [r.TechnicianName && (r.TechnicianName + " (" + (r.TestedBy || "technician") + ")"), actorOf(r) && ("recorded by " + actorOf(r))].filter(Boolean).join(" · "), at: r.Created || r.InspectionDate});
const moveEvent = r => ({unit: r.ItemID, action: (r.Direction || "") + " movement", details: [(r.FromLocation || "—") + " → " + (r.ToLocation || "—"), r.Reason, r.DocketNo, r.Remarks].filter(Boolean).join(" · "),
  actor: actorOf(r) ? "recorded by " + actorOf(r) : "", at: r.Created || r.MovementDate});
const claimEvent = r => ({unit: r.ItemID, action: "Warranty claim", details: [r.ClaimStatus, r.OEMSupplier, r.DC_x0020_Number, r.FaultReported && String(r.FaultReported).slice(0, 140)].filter(Boolean).join(" · "),
  actor: actorOf(r) ? "recorded by " + actorOf(r) : "", at: r.Created});
const INSP_Q = "$select=Id,ItemID,InspectionDate,TestedBy,TechnicianName,TestResult,OEMDecision,FaultObserved,NextAction,Created,Author/Title&$expand=Author";
const MOVE_Q = "$select=Id,ItemID,MovementDate,Direction,FromLocation,ToLocation,Reason,DocketNo,Remarks,Created,Author/Title&$expand=Author";
const CLAIM_Q = "$select=Id,ItemID,OEMSupplier,ClaimStatus,FaultReported,DC_x0020_Number,Created,Author/Title&$expand=Author";
async function loadActivity(){
  D.activityError = "";
  try{
    const tail = "&$orderby=Id desc&$top=40";
    const [i, m, c] = await Promise.all([spQuery("Inspections", INSP_Q + tail), spQuery("Movements", MOVE_Q + tail), spQuery("Claims", CLAIM_Q + tail)]);
    D.activity = [...i.map(inspEvent), ...m.map(moveEvent), ...c.map(claimEvent)].sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 90);
  }catch(e){ if(e instanceof SignedOut) return showSignin("Your session expired. Sign in to carry on."); D.activityError = explain(e, "Could not load activity"); }
  if(view === "activity") render();

/* ============================================================
   SAVING — every batch re-reads the lists first, checks each unit
   against the same rules the Power App applies, then writes unit by
   unit and reports exactly which ones did not go through.
   ============================================================ */
class Skip extends Error{}
async function withBusy(msg, fn){
  if(busy) return;
  busy = {msg}; render();
  const prog = (done, total) => { const e = $("#busy-msg"); if(e) e.textContent = msg + " " + done + " of " + total; };
  try{ await fn(prog); }
  catch(e){
    if(e instanceof SignedOut){ busy = null; return showSignin("Your session expired. Sign in to carry on. Nothing further was saved."); }
    notice = {error: true, text: explain(e, "Not completed")}; toast(notice.text, true);
  }
  busy = null;
  try{ await loadCore(); }catch(e){ if(e instanceof SignedOut) return showSignin("Your session expired. Sign in to carry on."); }
  render();
}
async function runBatch(items, label, worker, prog){
  const out = []; let next = 0, done = 0;
  const lane = async () => {
    while(next < items.length){
      const it = items[next++];
      try{ await worker(it); out.push({label: label(it), ok: true}); }
      catch(e){
        if(e instanceof SignedOut) throw e;
        out.push({label: label(it), ok: false, skipped: e instanceof Skip, error: e.message === "Failed to fetch" ? "no connection" : e.message});
      }
      prog(++done, items.length);
    }
  };
  await Promise.all([lane(), lane(), lane()]);
  return out;
}
function report(out, okText){
  const bad = out.filter(o => !o.ok), good = out.length - bad.length;
  if(!bad.length){ notice = null; toast(okText(good)); return; }
  notice = {error: true, text: good + " saved. " + bad.length + " not saved — check these before retrying:", items: bad.map(b => b.label + ": " + b.error)};
  toast(good + " saved, " + bad.length + " need review. See the message at the top.", true);
}
/* The unit's own row is updated last. If that step fails after its record was
   written, the change is kept on this device so it can be finished, never lost. */
async function patchUnit(u, patch){
  try{ await spMerge("Items", u.Id, patch); Object.assign(u, patch); u.stage = stageOf(u); }
  catch(e){
    pendingSet(pendingList().filter(p => p.id !== u.Id).concat([{id: u.Id, title: u.Title, patch}]));
    if(e instanceof SignedOut) throw e;
    throw new Error("record saved, but the unit status did not update (" + (e.message === "Failed to fetch" ? "no connection" : e.message) + "). Use Finish update.");
  }
}

function inspectProblem(){

async function actInspect(){

  prefs.by = f.by; prefs.technician = f.technician.trim(); lsSet("hala_motor_prefs", JSON.stringify(prefs));

      const u = D.units.find(x => x.Id === id);
      if(!u) throw new Skip("no longer in the register");
      if(!u.AtJeedimetla) throw new Skip("no longer at Jeedimetla");
      if(u.Availability !== seen.get(id)) throw new Skip("changed by someone else (now " + (u.Availability || "no status") + ")");
      const row = {Title: u.Title, ItemID: u.Title, InspectionDate: iso, TestedBy: f.by, TechnicianName: f.technician.trim(),

    }, prog);
    selected.clear(); F.insp.result = ""; F.insp.decision = ""; F.insp.fault = ""; D.activity = null;
    report(out, n => n + (n === 1 ? " inspection" : " inspections") + " saved. Units moved to: " + (next === AV.availBench ? "Available to use" : next === AV.claimReady ? "Ready for warranty claim" : "Scrap") + ".");
  });
}

async function askClaim(){

    const r = latestRepair(repairs, u.Title);
    if(r){ const days = daysBetween(r.ReturnDate, r.FaultDate || new Date()); if(days >= 0 && days <= 15) warns.push(u.Title + ": returned after repair on " + fmt(r.ReturnDate) + (r.FaultDate ? " and failed again on " + fmt(r.FaultDate) : "; this claim is " + days + " days after repair, and raising it records the repeat failure") + "."); }
    if(u.ItemType === "Motor" && (/sprinto/i.test(u.OEMMake || "") || /sprinto/i.test(claimOem))){

async function actClaim(fault){
  const oemName = claimOem, day = todayIST();
  await withBusy("Raising claims…", async prog => {
    await loadCore();
    let repairs = []; try{ repairs = await listAll(L("RepairCycles") + "/items?$select=Id,MotorID,ReturnDate,FaultDate&$top=5000"); }catch(e){ if(e instanceof SignedOut) throw e; }
    const units = eligibleClaims(oemName);
    if(!units.length){ notice = {text: "No " + oemName + " units are ready for a warranty claim."}; return; }
    const out = await runBatch(units, u => u.Title, async u => {
      /* A claim already raised for this unit is reused, so a retry never duplicates it. */
      const open = D.claims.filter(c => c.ItemID === u.Title && [CS.raised, CS.dc].includes(c.ClaimStatus)).sort((a, b) => b.Id - a.Id)[0];
      if(!open){
        const row = {Title: u.Title, ItemID: u.Title, OEMSupplier: oemName, ClaimStatus: CS.raised, WarrantyAtDespatch: warrantyAt(u, day)};
        if(u.ItemType) row.ItemType = u.ItemType;
        if(fault) row.FaultReported = fault;
        await spCreate("Claims", row);
      }
      await patchUnit(u, {TimesClaimed: (Number(u.TimesClaimed) || 0) + 1, Availability: AV.claimRaised});
      const r = latestRepair(repairs, u.Title);
      if(r && !r.FaultDate){
        const days = daysBetween(r.ReturnDate, new Date());
        if(days >= 0 && days <= 15){
          try{ await spMerge("RepairCycles", r.Id, {FaultDate: istMidnight(day), FaultNotes: "Fault reported when warranty claim was raised: " + (fault || ""), ClaimRef: u.Title, AlertStatus: "Pending"}); }
          catch(e){ if(e instanceof SignedOut) throw e; throw new Error("claim saved, but the repeat-failure alert was not recorded; record it in Repair checks"); }
        }
      }
    }, prog);
    D.activity = null; dcOem = oemName; F.dc.address = "";
    report(out, n => n + " " + oemName + (n === 1 ? " claim" : " claims") + " raised. Next: generate the delivery challan.");
    if(out.every(o => o.ok)) view = "dc";
  });
}

async function actDC(){
  const why = dcProblem(); if(why) return toast(why, true);
  const ids = [...dcSelected], address = F.dc.address.trim(), vehicle = F.dc.vehicle.trim(), oemName = dcOem;
  let doc = null;
  await withBusy("Generating delivery challan…", async prog => {
    await loadCore();
    const chosen = ids.map(id => D.claims.find(c => c.Id === id)).filter(Boolean).sort((a, b) => a.Id - b.Id);
    const stale = chosen.filter(c => !isDcPending(c));
    if(chosen.length !== ids.length || stale.length){ dcSelected.clear(); notice = {error: true, text: "Some selected claims already have a DC or are no longer awaiting one. The list has been refreshed; select again."}; return; }
    if(new Set(chosen.map(c => norm(c.OEMSupplier))).size !== 1){ notice = {error: true, text: "A delivery challan must contain one OEM."}; return; }
    /* Numbered like the Power App's challans, from the first claim in the batch, so a retry reuses the same number. */
    const first = chosen[0], now = new Date().toISOString();
    const number = "DC-HM-" + new Date(first.Created || now).getFullYear() + "-" + String(first.Id).padStart(6, "0");
    doc = {number, day: todayIST(), from: HOME, oem: first.OEMSupplier, destination: address, vehicle, createdBy: AUTH.name || AUTH.upn || "Hala",
      units: chosen.map(c => { const u = unitOf(c); return {unitId: u.Title, type: u.ItemType || "", serial: u.SerialNo || u.Title}; })};
    doc.bytes = challanPdf(doc);
    /* The PDF is filed first: no claim is marked "DC generated" unless its document exists. */
    const up = await sp("GetFolderByServerRelativeUrl(" + lit(CFG.dcFolder) + ")/Files/add(url=" + lit(number + ".pdf") + ",overwrite=true)", {bytes: doc.bytes, method: "POST"});
    const rel = (up && up.ServerRelativeUrl) || (CFG.dcFolder + "/" + number + ".pdf");
    const url = CFG.spHost + encodeURI(rel);
    const out = await runBatch(chosen, c => c.ItemID, async c => {
      await spMerge("Claims", c.Id, {DC_x0020_Number: number, DC_x0020_URL: url, DC_x0020_Generated_x0020_Date: now, ClaimStatus: CS.dc});
      await patchUnit(unitOf(c), {Availability: AV.dcReady});
    }, prog);
    const addr = lsJson("hala_motor_addr", {}); addr[oemName] = address; lsSet("hala_motor_addr", JSON.stringify(addr));
    dcSelected.clear(); F.dc.vehicle = ""; D.activity = null;
    report(out, n => number + " generated for " + n + (n === 1 ? " unit" : " units") + ". The batch is ready for dispatch.");
  });
  if(doc && doc.bytes && !notice) saveBlob(new Blob([doc.bytes], {type: "application/pdf"}), doc.number + ".pdf");
}
async function downloadDC(number){
  const d = dcList().find(x => x.number === number); if(!d || !d.url) return toast("This challan has no stored document.", true);
  let u; try{ u = new URL(d.url); }catch(e){ return toast("The stored document link is not valid.", true); }
  if(u.origin !== CFG.spHost) return toast("The stored document is not on the Hala SharePoint site.", true);
  try{
    const path = decodeURIComponent(u.pathname);
    if(/^\/sites\//.test(path) && /\.pdf$/i.test(path)){
      saveBlob(await sp("GetFileByServerRelativeUrl(" + lit(path) + ")/$value", {blob: true}), number + ".pdf");
    }else window.open(d.url, "_blank", "noopener");
  }catch(e){
    if(e instanceof SignedOut) return showSignin("Your session expired. Sign in to carry on.");
    window.open(d.url, "_blank", "noopener");
  }
}

async function actShip(number, day, reference){
  if(!validDay(day)) return toast("Choose the date shipped.", true);
  await withBusy("Marking shipped…", async prog => {
    await loadCore();
    const d = dcList().find(x => x.number === number);
    if(!d || !d.ready.length){ notice = {error: true, text: "Generate a DC for the current claims before marking shipment."}; return; }
    const iso = istMidnight(day);
    const out = await runBatch(d.ready, c => c.ItemID, async c => {
      const u = unitOf(c), key = "SHIP-CLAIM-" + c.Id;
      const row = {Title: key, ItemID: u.Title, MovementDate: iso, Direction: "Outward", FromLocation: u.CurrentLocation || HOME, ToLocation: PLANT,
        Reason: SHIP_REASON, Remarks: "DC: " + c.DC_x0020_Number + " | Claim: " + c.Id};
      if(u.ItemType) row.ItemType = u.ItemType;
      if(reference) row.DocketNo = reference;
      /* One movement per claim, found again by its key, so a retry updates it instead of adding a second. */
      const existing = (await spQuery("Movements", "$select=Id&$top=1&" + filterEq("Title", key)))[0];
      if(existing) await spMerge("Movements", existing.Id, row); else await spCreate("Movements", row);
      const cp = {DateSentToOEM: iso, ClaimStatus: CS.sent}; if(reference) cp.DocketNo = reference;
      await spMerge("Claims", c.Id, cp);
      await patchUnit(u, {CurrentLocation: PLANT, AtJeedimetla: false, Availability: AV.away, LastMovementReason: SHIP_REASON, LastMovementDate: iso});
    }, prog);
    D.activity = null; D.recentMoves = null;
    report(out, n => n + (n === 1 ? " unit" : " units") + " marked shipped with " + number + ".");
  });
}

const odysseModel = (typ, oemName, id) => typ === "Motor" && /odysse/i.test(oemName || "") ? (startsCI(String(id).trim(), "WDM") ? "Odysse Snap" : "Odysse Hyfy") : null;

const regTouched = {oem: false, serial: false, model: false};
function regSync(src){
  const typ = $("#reg-type"), id = $("#reg-id"), o = $("#reg-oem"), model = $("#reg-model"), serial = $("#reg-serial"); if(!typ) return;
  if(!src){ regTouched.oem = regTouched.serial = regTouched.model = false; }
  const controller = typ.value === "Controller";
  $("#reg-id-label").textContent = controller ? "Controller ID · optional, generated if blank" : "Motor ID *";
  if(!regTouched.oem && (src === "id" || !src)) o.value = oemFromId(id.value) || "";
  const fixed = odysseModel(typ.value, o.value, id.value);
  if(fixed !== null){ model.value = fixed; model.readOnly = true; } else { if(model.readOnly) model.value = ""; model.readOnly = false; }
  if(!regTouched.serial) serial.value = controller ? "" : id.value.trim();

async function actRegister(form){
  const v = Object.fromEntries(new FormData(form)); const id = String(v.unitId || "").trim(), typ = v.type;
  if(!typ || (!id && typ !== "Controller") || !validDay(v.date) || !v.condition || !v.source) return toast("Complete the item type, condition, received date and source. Motors also need an ID.", true);
  if(v.date > todayIST()) return toast("The received date cannot be in the future.", true);
  const iso = istMidnight(v.date);
  const reason = startsCI(v.source, "Jeedimetla") ? "Stock audit correction" : !startsCI(v.source, "OEM") ? "Hub to Jeedimetla (return)"
    : v.condition === "Repaired" ? "Received from OEM - repaired" : v.condition === "New" ? "New stock receipt (purchase)" : "Stock audit correction";
  $("#modal").close();
  await withBusy("Registering unit…", async () => {
    if(id){
      const dup = await spQuery("Items", "$select=Id,Title&$top=1&" + filterEq("Title", id));
      if(dup.length){ notice = {error: true, text: id + " is already registered. Open it under All units; registration details are edited in the Power App."}; toast(notice.text, true); return; }
    }
    const fixed = odysseModel(typ, v.oem, id);
    const row = {Title: id || ("CTL-PENDING-" + crypto.randomUUID()), ItemType: typ, Model: fixed !== null ? fixed : String(v.model || "").trim(), SerialNo: String(v.serial || "").trim(),
      DateFirstReceived: iso, Condition: v.condition, AtJeedimetla: true, CurrentLocation: HOME,
      Availability: ["New", "Repaired"].includes(v.condition) ? AV.availOem : AV.bench, LastMovementDate: iso, LastMovementReason: reason};
    if(v.oem) row.OEMMake = v.oem;

    let finalId = row.Title;
    if(!id){

      finalId = "CTL-" + String(made.Id).padStart(6, "0");

      if(clash.length) throw new Error("The generated ID " + finalId + " is already in use. The saved record is kept for review.");
      await spMerge("Items", made.Id, {Title: finalId});
    }
    const mv = {Title: "REG-RECEIPT-" + made.Id, ItemID: finalId, ItemType: typ, MovementDate: iso, Direction: "Inward", FromLocation: v.source, ToLocation: HOME, Reason: reason};

    D.activity = null; D.recentMoves = null; notice = null;
    toast("Registered " + finalId + " — inward receipt recorded.");
  });
}

  if(!M.reason) return "Pick a reason.";
  if(!validDay(M.date)) return "Pick the movement date.";
  if(M.dir === "Outward" && !startsCI(M.unit.Availability, "AVAILABLE")){
    const c = D.latestClaim.get(M.unit.Title);
    if(!(M.to === "OEM - Supplier Works" && c && c.ClaimStatus === "Approved"))
      return "Not cleared to go out: only AVAILABLE units, or units with an approved claim going to OEM - Supplier Works.";
  }
  return "";
}
function moveView(){
  return title("Stock movements", "Log inward / outward", "Record a unit arriving at Jeedimetla or leaving for a hub.") +
    '<section class="panel"><div class="panel-head"><h2>Record a movement</h2><span class="small-note">Warranty dispatch uses Delivery challans</span></div><div class="mv-form">' +
    '<div class="field wide"><span id="lblDir">Direction</span><div class="seg" role="radiogroup" aria-labelledby="lblDir"><button type="button" role="radio" id="dirIn">Inward</button><button type="button" role="radio" id="dirOut">Outward</button></div></div>' +
    field('<span id="lblFrom">From</span>', '<select id="selFrom"></select>') + field('<span id="lblTo">To</span>', '<select id="selTo"></select>') +
    '<div class="field wide"><label for="unitInput">Motor ID *</label><div class="combo"><input id="unitInput" type="text" role="combobox" aria-expanded="false" aria-controls="unitList" aria-autocomplete="list" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" style="width:100%">' +
    '<button type="button" class="combo-x" id="unitClear" aria-label="Clear Motor ID" hidden>×</button><ul class="combo-list" id="unitList" role="listbox" hidden></ul></div><div class="field-note" id="where"></div></div>' +
    field("Movement date", '<input id="inpDate" type="date">') + field("Reason *", '<select id="selReason"></select>') +
    '<div class="rule-note wide" id="rule" hidden></div></div>' +
    '<div class="bulkbar"><span id="why"></span><button class="primary" id="btnSave" disabled>Save movement ' + icon("arrow") + '</button></div></section>' +
    '<section class="panel"><div class="panel-head"><h2>Latest movements</h2><span class="small-note">Most recent first</span></div><div id="recentRows"></div></section>';
}
function fillSelect(sel, values, current, fixed){
  /* Only rebuild the options when they actually change: replacing them while
     the dropdown is opening would close it under the user's finger. */
  const extra = current && !values.includes(current) ? current : "";
  const sig = JSON.stringify([fixed, values, extra]);
  if(sel.dataset.sig !== sig){
    sel.dataset.sig = sig; sel.textContent = "";
    if(fixed) sel.appendChild(new Option(fixed, fixed));
    else{
      sel.appendChild(new Option("Select…", ""));
      for(const v of values) sel.appendChild(new Option(v, v));
      if(extra) sel.appendChild(new Option(extra, extra));
    }
  }
  sel.disabled = !!fixed;
  const want = fixed || current || "";
  if(sel.value !== want) sel.value = want;
}
function moveRender(){
  const inward = M.dir === "Inward", inp = $("#unitInput"); if(!inp) return;
  $("#dirIn").setAttribute("aria-checked", String(inward)); $("#dirOut").setAttribute("aria-checked", String(!inward));
  $("#lblFrom").textContent = inward ? "From *" : "From"; $("#lblTo").textContent = inward ? "To" : "To *";
  fillSelect($("#selFrom"), D.locations, M.from, inward ? "" : HOME);
  fillSelect($("#selTo"), D.locations, M.to, inward ? HOME : "");
  fillSelect($("#selReason"), D.reasons, M.reason, "");
  if($("#inpDate").value !== M.date) $("#inpDate").value = M.date;
  const n = moveCandidates().length;
  let ph = "Find items", off = false;
  if(!inward && !M.to){ ph = "Pick ‘To’ first"; off = true; }
  else if(!n){ off = true; ph = inward ? "No units away from Jeedimetla" : faultyRoute(M.to) ? "No faulty units at Jeedimetla" : "No bench-tested units in stock"; }
  inp.placeholder = ph; inp.disabled = off;
  if(M.unit){ if(document.activeElement !== inp) inp.value = M.unit.Title; } else if(off) inp.value = "";
  $("#unitClear").hidden = !inp.value || off;
  const w = $("#where");
  w.innerHTML = M.unit ? 'Currently at: <b>' + esc(M.unit.CurrentLocation || "—") + '</b> | <b>' + esc(M.unit.Availability || "—") + '</b>' : off ? "" : n + (n === 1 ? " unit" : " units") + " to choose from";
  const rule = $("#rule");
  if(inward && M.reason){ rule.textContent = EX_OEM_REASONS.includes(M.reason) ? "Ex-OEM: goes straight to AVAILABLE, no bench test needed." : "From a hub: this unit will need a bench test before use."; rule.hidden = false; }
  else rule.hidden = true;
  const why = moveBlock();
  $("#why").textContent = M.saving ? "Saving…" : why;
  $("#btnSave").disabled = M.saving || !!why;
  const rows = $("#recentRows");
  rows.innerHTML = !D.recentMoves ? '<div class="empty"><h3>Loading…</h3></div>' : D.recentMoves.length ? '<div class="table-wrap"><table><thead><tr><th>Unit</th><th>Direction</th><th>Route</th><th>Reason</th><th>Date</th></tr></thead><tbody>' +
    D.recentMoves.map(m => '<tr><td class="unit-id">' + esc(m.ItemID) + '</td><td><span class="chipline ' + (m.Direction === "Outward" ? "out" : "") + '">' + esc(m.Direction || "") + '</span></td><td>' +
      esc((m.FromLocation || "—") + " → " + (m.ToLocation || "—")) + '</td><td>' + esc(m.Reason || "") + '</td><td>' + fmt(m.MovementDate) + '</td></tr>').join("") + '</tbody></table></div>'
    : '<div class="empty"><h3>No movements yet</h3></div>';
}
async function loadRecentMoves(){
  try{ D.recentMoves = await spQuery("Movements", "$select=Id,ItemID,MovementDate,Direction,FromLocation,ToLocation,Reason&$orderby=Id desc&$top=10"); }
  catch(e){ if(e instanceof SignedOut) return showSignin("Your session expired. Sign in to carry on."); D.recentMoves = []; }
  if(view === "move") moveRender();
}
const combo = {open: false, idx: -1, items: []};
function comboMatches(){
  const inp = $("#unitInput"), q = inp.value.trim().toLowerCase(), all = moveCandidates().slice().sort(byTitle);
  if(!q || (M.unit && inp.value === M.unit.Title)) return all;
  return all.filter(u => String(u.Title).toLowerCase().includes(q));
}
function comboOpen(){
  const ul = $("#unitList"), inp = $("#unitInput"); if(inp.disabled) return;
  combo.items = comboMatches(); combo.open = true;
  if(combo.idx >= combo.items.length) combo.idx = combo.items.length - 1;
  const shown = combo.items.slice(0, 80);
  ul.innerHTML = shown.map((u, i) => '<li role="option" id="opt' + i + '" data-opt="' + i + '" aria-selected="' + (i === combo.idx) + '"><div class="id">' + esc(u.Title) + '</div><div class="sub">' +
    esc([u.ItemType, u.OEMMake, u.CurrentLocation].filter(Boolean).join(" · ")) + '</div></li>').join("") +
    (!shown.length ? '<li class="none">No match in this list.</li>' : combo.items.length > shown.length ? '<li class="none">' + (combo.items.length - shown.length) + ' more — keep typing to narrow down.</li>' : '');
  ul.hidden = false; inp.setAttribute("aria-expanded", "true");
  if(combo.idx >= 0) inp.setAttribute("aria-activedescendant", "opt" + combo.idx); else inp.removeAttribute("aria-activedescendant");
  const act = ul.querySelector('[aria-selected="true"]'); if(act) act.scrollIntoView({block: "nearest"});
}
function comboClose(){
  combo.open = false; combo.idx = -1;
  const ul = $("#unitList"), inp = $("#unitInput"); if(!ul) return;
  ul.hidden = true; inp.setAttribute("aria-expanded", "false"); inp.removeAttribute("aria-activedescendant");
}
function pickUnit(u){
  M.unit = u; $("#unitInput").value = u.Title; comboClose();
  /* An inward unit usually comes from where it was last recorded. */
  if(M.dir === "Inward" && !M.from && D.locations.includes(u.CurrentLocation) && !startsCI(u.CurrentLocation, "Jeedimetla")) M.from = u.CurrentLocation;
  moveRender();
}
function clearUnit(){ M.unit = null; const i = $("#unitInput"); if(i) i.value = ""; comboClose(); }
function setDir(d){ if(M.dir === d) return; M.dir = d; M.from = ""; M.to = ""; clearUnit(); moveRender(); }
function moveMount(){
  if(M.unit) M.unit = D.units.find(u => u.Id === M.unit.Id) || null;
  const inp = $("#unitInput");
  $("#dirIn").addEventListener("click", () => setDir("Inward"));
  $("#dirOut").addEventListener("click", () => setDir("Outward"));
  for(const id of ["dirIn", "dirOut"]) $("#" + id).addEventListener("keydown", ev => {
    if(!/^Arrow/.test(ev.key)) return; ev.preventDefault();
    const next = id === "dirIn" ? "Outward" : "Inward"; setDir(next); $(next === "Inward" ? "#dirIn" : "#dirOut").focus();
  });
  $("#selFrom").addEventListener("change", ev => { M.from = ev.target.value; moveRender(); });
  $("#selTo").addEventListener("change", ev => { M.to = ev.target.value; clearUnit(); moveRender(); });
  $("#selReason").addEventListener("change", ev => { M.reason = ev.target.value; moveRender(); });
  $("#inpDate").addEventListener("change", ev => { M.date = ev.target.value; moveRender(); });
  $("#btnSave").addEventListener("click", moveSave);
  $("#unitClear").addEventListener("click", () => { clearUnit(); moveRender(); inp.focus(); });
  $("#unitList").addEventListener("mousedown", ev => { const li = ev.target.closest("[data-opt]"); if(!li) return; ev.preventDefault(); pickUnit(combo.items[Number(li.dataset.opt)]); });
  inp.addEventListener("focus", () => { inp.select(); combo.idx = -1; comboOpen(); });
  inp.addEventListener("click", () => { if(!combo.open) comboOpen(); });
  inp.addEventListener("input", () => { if(M.unit && inp.value !== M.unit.Title) M.unit = null; combo.idx = -1; moveRender(); comboOpen(); });
  inp.addEventListener("blur", () => { comboClose(); moveRender(); });
  inp.addEventListener("keydown", ev => {
    if(ev.key === "ArrowDown" || ev.key === "ArrowUp"){
      ev.preventDefault(); if(!combo.open){ comboOpen(); return; }
      const max = Math.min(combo.items.length, 80) - 1;
      combo.idx = ev.key === "ArrowDown" ? Math.min(max, combo.idx + 1) : Math.max(0, combo.idx - 1); comboOpen();
    }else if(ev.key === "Enter"){
      if(!combo.open) return; ev.preventDefault();
      const q = inp.value.trim().toLowerCase();
      const hit = combo.idx >= 0 ? combo.items[combo.idx] : combo.items.find(u => String(u.Title).toLowerCase() === q) || (combo.items.length === 1 ? combo.items[0] : null);
      if(hit) pickUnit(hit);
    }else if(ev.key === "Escape" && combo.open){ ev.preventDefault(); ev.stopPropagation(); comboClose(); }
  });
  moveRender();
}
async function moveSave(){
  if(M.saving || moveBlock()) return;
  const u = M.unit, dir = M.dir, reason = M.reason, date = M.date;
  const to = dir === "Inward" ? HOME : M.to, from = dir === "Outward" ? HOME : M.from;
  M.saving = true; moveRender();
  let redraw = false;
  try{
    /* Read the unit as it is right now: someone else may have moved it since the list loaded. */
    const live = await sp(L("Items") + "/items(" + Number(u.Id) + ")?$select=" + ITEM_COLS);
    const before = u.Availability + "|" + !!u.AtJeedimetla;
    Object.assign(u, live); u.stage = stageOf(u);
    if(!moveCandidates().includes(u) || moveBlock()){
      const changed = before !== live.Availability + "|" + !!live.AtJeedimetla;
      clearUnit(); redraw = true;
      toast(changed ? live.Title + " was just updated by someone else (now at " + (live.CurrentLocation || "—") + "). Nothing was saved." : live.Title + " can no longer be moved this way. Nothing was saved.", true);
      return;
    }
    if(dir === "Outward" && (to === PLANT || WARRANTY_REASONS.includes(reason) || WARRANTY_STATES.includes(live.Availability))){ toast(WARRANTY_MSG, true); return; }
    const iso = istMidnight(date);
    const row = {Title: u.Title + " / " + date + " / " + dir, ItemID: u.Title, MovementDate: iso, Direction: dir, FromLocation: from, ToLocation: to, Reason: reason};
    if(live.ItemType) row.ItemType = live.ItemType;
    const made = await spCreate("Movements", row);
    const atHome = startsCI(to, "Jeedimetla");
    const patch = {CurrentLocation: to, LastMovementReason: reason, LastMovementDate: iso, AtJeedimetla: atHome,
      Availability: live.Availability === AV.scrap ? AV.scrap : !atHome ? AV.away : EX_OEM_REASONS.includes(reason) ? AV.availOem : AV.bench};
    if(D.recentMoves) D.recentMoves = [Object.assign({Id: made && made.Id}, row)].concat(D.recentMoves).slice(0, 10);
    D.activity = null; redraw = true;
    clearUnit(); M.reason = "";
    try{ await patchUnit(u, patch); toast(u.Title + " moved to " + to); }
    catch(e){ if(e instanceof SignedOut) throw e; toast("Movement saved, but the unit status did not update. Use Finish update at the top.", true); }
  }catch(e){
    if(e instanceof SignedOut) return showSignin("Your session expired. Sign in to carry on.");
    toast("Not saved: " + (e.message === "Failed to fetch" ? "no connection to SharePoint." : e.message), true);
  }finally{
    M.saving = false;
    /* If the sign-in card replaced the page, leave it alone. */
    if(view === "move" && $("#unitInput")){ if(redraw) render(); else moveRender(); }
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
function redrawTable(){
  const box = $("#unit-table"); if(!box) return;
  box.innerHTML = pagedTable(view === "inspections", view === "inventory");
  const rc = $("#result-count"); if(rc) rc.textContent = filtered().length + " matching units";
  syncSelection();
}
function syncSelection(){
  const sc = $("#selected-count"); if(sc) sc.textContent = selected.size + " units selected";
  const b = $('[data-action="inspect"]'); if(b) b.disabled = !selected.size;
  const c = $('[data-action="clear-selection"]'); if(c) c.disabled = !selected.size;
  const m = $('[data-action="select-matching"]'); if(m) m.firstChild.textContent = "Select all " + filtered().length + " matching";
}
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(d.page){ page = Number(d.page); redrawTable(); return; }
  if(d.nav){ $("#modal").open && $("#modal").close(); nav(d.nav); return; }
  if(d.stage){ nav("inventory"); stage = d.stage; render(); return; }
  if(d.claimOem){ claimOem = d.claimOem; render(); return; }
  if(d.dcOem){ dcOem = d.dcOem; dcSelected.clear(); F.dc.address = ""; render(); return; }
  if(d.history){ openHistory(Number(d.history)); return; }
  if(d.download){ downloadDC(d.download); return; }
  if(d.ship){ askShip(d.ship); return; }
  if(d.confirmShip){ const day = $("#ship-date").value, ref = $("#ship-reference").value.trim(); $("#modal").close(); await actShip(d.confirmShip, day, ref); return; }
  if(d.finish !== undefined){
    const list = pendingList(), p = list[Number(d.finish)]; if(!p) return;
    t.disabled = true; t.textContent = "Updating…";
    try{
      await spMerge("Items", p.id, p.patch);
      pendingSet(pendingList().filter(x => x.id !== p.id));
      const u = D.units.find(x => x.Id === p.id); if(u){ Object.assign(u, p.patch); u.stage = stageOf(u); }
      toast(p.title + " updated."); render();
    }catch(err){
      if(err instanceof SignedOut) return showSignin("Your session expired. Sign in to carry on.");
      t.disabled = false; t.textContent = "Finish update"; toast("Still could not update: " + err.message, true);
    }
    return;
  }
  switch(d.action){
    case "signin": signIn(false); break;
    case "signout": clearAuth(true); sessionStorage.removeItem(SS_SILENT); $("#modal").open && $("#modal").close(); D.loaded = false; showSignin(""); break;
    case "menu": $(".sidebar").classList.toggle("open"); break;
    case "close": $("#modal").close(); break;
    case "dismiss": notice = null; render(); break;
    case "refresh": if(D.loaded) toast("Refreshing records…"); await loadAll(); break;
    case "export": exportView(); break;
    case "register": askRegister(); break;
    case "inspect": await actInspect(); break;
    case "select-matching": filtered().forEach(u => selected.add(u.Id)); redrawTable(); break;
    case "clear-selection": selected.clear(); redrawTable(); break;
    case "claim": await askClaim(); break;
    case "claim-confirm": { const fault = $("#claim-fault").value.trim(); $("#modal").close(); await actClaim(fault); break; }
    case "dc": await actDC(); break;
    case "connection":
      modal("Hala workspace", '<p>Signed in as <strong>' + esc(AUTH.name || AUTH.upn) + '</strong>' + (AUTH.upn && AUTH.name ? ' (' + esc(AUTH.upn) + ')' : '') + '.</p>' +
        '<p>Records are read from and saved to the Fleet Ops SharePoint lists under your own account, so your SharePoint permissions apply.</p>' +
        '<p>OEM decisions, hub receipts, QR operations, labels, worksheets and masters remain in the Power App: <a href="' + esc(CFG.powerApp) + '" rel="noopener" target="_blank">open Motor Tracker in Power Apps</a>.</p>',
        '<button data-action="signout">Sign out</button>');
      break;
  }
});
document.addEventListener("submit", async e => { if(e.target.id === "register-form"){ e.preventDefault(); await actRegister(e.target); } });
document.addEventListener("input", e => {
  const id = e.target.id;
  if(id === "search"){ search = e.target.value; page = 1; redrawTable(); return; }
  if(id === "inspect-technician") F.insp.technician = e.target.value;
  else if(id === "inspect-fault") F.insp.fault = e.target.value;
  else if(id === "inspect-date") F.insp.date = e.target.value;
  else if(id === "dc-address") F.dc.address = e.target.value;
  else if(id === "dc-vehicle") F.dc.vehicle = e.target.value;
  else if(id === "reg-id") regSync("id");
  else if(id === "reg-serial") regTouched.serial = true;
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.id === "filter-oem"){ oem = t.value; page = 1; selected.clear(); render(); }
  else if(t.id === "filter-type"){ type = t.value; page = 1; selected.clear(); render(); }
  else if(t.id === "filter-stage"){ stage = t.value; page = 1; render(); }
  else if(t.id === "inspect-scope"){ F.insp.scope = t.value; page = 1; selected.clear(); render(); }
  else if(t.id === "inspect-by") F.insp.by = t.value;
  else if(t.id === "inspect-result"){ F.insp.result = t.value; F.insp.decision = ""; render(); }
  else if(t.id === "inspect-decision") F.insp.decision = t.value;
  else if(t.id === "reg-type") regSync("type");
  else if(t.id === "reg-oem"){ regTouched.oem = true; regSync("oem"); }
  else if(t.dataset.unit){
    const id = Number(t.dataset.unit); if(t.checked) selected.add(id); else selected.delete(id);
    t.closest("tr").classList.toggle("row-select", t.checked); syncSelection();
    const all = $('[data-select-all="units"]'); if(all) all.checked = pageUnits().every(u => selected.has(u.Id));
  }
  else if(t.dataset.claim){ const id = Number(t.dataset.claim); if(t.checked) dcSelected.add(id); else dcSelected.delete(id); }
  else if(t.dataset.selectAll === "units"){ pageUnits().forEach(u => t.checked ? selected.add(u.Id) : selected.delete(u.Id)); redrawTable(); }
  else if(t.dataset.selectAll === "claims"){
    dcPending(dcOem).forEach(c => t.checked ? dcSelected.add(c.Id) : dcSelected.delete(c.Id));
    document.querySelectorAll("[data-claim]").forEach(c => { c.checked = t.checked; });
  }
});
/* Lists go stale while the tab sits in the background; reload when it comes back. */
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && D.loaded && !busy && !M.saving && !$("#modal").open && Date.now() - D.lastLoad > 120000 && !selected.size && !dcSelected.size) loadAll();
});

(async function boot(){
  loadAuth();
  const res = await handleRedirect();
  if(res && res !== "silent"){ showSignin(res); return; }
  if(tokenFresh() || AUTH.refresh){ render(); loadAll(); return; }
  /* A device that has signed in before gets one quiet attempt per browser session. */
  if(res !== "silent" && AUTH.known && !sessionStorage.getItem(SS_SILENT)){ sessionStorage.setItem(SS_SILENT, "1"); signIn(true); return; }
  showSignin("");
})();

</script>
